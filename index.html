<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koło Fortuny</title>
    <link rel="stylesheet" href="style.css"> 
</head>

<body>
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <h3>Zarządzaj graczami</h3>
            <div class="modal-controls">
                <input type="text" id="playerNameInput" placeholder="Wpisz imię gracza">
                <input type="button" id="addPlayerBtn" value="Dodaj">
            </div>
            <ul id="modalPlayerList"></ul>
            <input type="button" id="closeModalBtn" value="Zamknij / Graj">
            <p class="modal-info">Zostaw pustą listę, aby grać bez zliczania punktów.</p>
        </div>
    </div>

    <div class="left">
        <div class="spin">
            <input type="button" value="KRĘĆ" class="spinButton">
            <div id="myProgress">
                <div id="myBar"></div>
              </div>
        </div>
        
        <div class="control">
            <input type="password" class="phraseInput" placeholder="Własne hasło...">
            <input type="button" value="Graj" class="playButton">
            <input type="button" value="Gracze" class="playersButton">
        </div>

        <div class="guessing">
            <input type="text" class="letterInput" maxlength="1" placeholder="Litera">
            <input type="button" value="Zgadnij" class="guessButton">
        </div>

        <div class="log">

        </div>

        <input type="button" value="Odkryj 👁" class="showButton">
    </div>

    <div class="main">
        <div class="game-area">
            <p class="phrasal"></p>
            <div id="scoreboard"></div>
        </div>
    </div>

    <div class="right">
        <div class="spinner">
            <div class="wheel"></div>
            <div class="pointer"></div>  
        </div>  
    </div>

    <script src="main.js"></script>
</body>
</html>
